name: Evaluate agent on PR

on:
  pull_request:
    paths:
      - "agents/**"
      - "prompts/**"
      - "evals/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  evaluate:
    name: Deploy to test and evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure login (OIDC federation)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Determine semver from PR number
        id: version
        run: echo "semver=0.0.0-pr.${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Deploy agent to TEST project
        id: deploy
        env:
          FOUNDRY_TEST_ENDPOINT:  ${{ vars.FOUNDRY_TEST_ENDPOINT }}
          GPT_DEPLOYMENT:         ${{ vars.GPT_DEPLOYMENT }}
        run: |
          TOOLS=$(python3 -c "
          import json
          cfg = json.load(open('agents/tech-trends-agent.json'))
          print(','.join(t['type'] for t in cfg['definition']['tools']))
          ")
          PHASE=$(python3 -c "
          import json
          cfg = json.load(open('agents/tech-trends-agent.json'))
          print(cfg.get('phase', '1'))
          ")
          python scripts/deploy_agent.py \
            --env test \
            --semver "${{ steps.version.outputs.semver }}" \
            --tools "$TOOLS"
          echo "phase=$PHASE" >> $GITHUB_OUTPUT

      - name: Smoke test — invoke agent and verify response
        id: smoke
        env:
          FOUNDRY_TEST_ENDPOINT: ${{ vars.FOUNDRY_TEST_ENDPOINT }}
        run: |
          python3 << 'EOF'
          import os
          from azure.ai.projects import AIProjectClient
          from azure.identity import DefaultAzureCredential

          client = AIProjectClient(
              endpoint=os.environ["FOUNDRY_TEST_ENDPOINT"],
              credential=DefaultAzureCredential()
          )

          agent = client.agents.get(agent_name="tech-trends-agent")
          print(f"Agent: {agent.name}")

          openai_client = client.get_openai_client()

          response = openai_client.responses.create(
              input="What are the latest trends in AI?",
              extra_body={"agent_reference": {"name": agent.name, "type": "agent_reference"}},
          )

          output = response.output_text
          if len(output) < 50:
              print(f"FAIL: Response too short ({len(output)} chars)")
              raise SystemExit(1)

          print(f"PASS: Agent responded ({len(output)} chars)")
          print(f"Preview: {output[:200]}...")
          EOF

      - name: Run Foundry evaluation
        id: eval
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_TEST_ENDPOINT }}
          deployment-name:           ${{ vars.GPT_DEPLOYMENT }}
          agent-ids:                 "tech-trends-agent:${{ steps.deploy.outputs.agent_version }}"
          data-path:                 "./evals/golden-dataset.json"
          evaluation-result-view:    "all-scores"

      - name: Post evaluation summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            let body = '## Agent Evaluation Results\n\n';
            body += `**Agent:** tech-trends-agent:${{ steps.deploy.outputs.agent_version }}\n`;
            body += `**Phase:** ${{ steps.deploy.outputs.phase }}\n`;
            body += `**Model:** ${{ vars.GPT_DEPLOYMENT }}\n`;
            body += `**Commit:** ${context.sha.slice(0,7)}\n\n`;
            const smokeStatus = '${{ steps.smoke.outcome }}' === 'success' ? '✅' : '❌';
            body += `**Smoke Test:** ${smokeStatus}\n\n`;
            body += 'Full results are in the [Actions summary](' +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
